services:
  postgres:
    image: postgres:15
    container_name: placa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-placa}
      POSTGRES_USER: ${DB_USER:-placa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-placa_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-placa} -d ${DB_NAME:-placa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: placa_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: placa_client
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - .env
    environment:
      # Vite runs inside this container, so "localhost" is the client itself.
      # The dev proxy must reach the API service by its compose name.
      VITE_PROXY_TARGET: http://server:5000
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev

  # One-shot production build. It writes the Vite output into a named volume
  # that nginx serves read-only, so the production image does not need Node.
  client-build:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./client:/app
      - /app/node_modules
      - client_dist:/app/dist
    command: sh -c "npm ci && npm run build"
    profiles:
      - production

  nginx:
    image: nginx:alpine
    container_name: placa_nginx
    restart: unless-stopped
    depends_on:
      client-build:
        condition: service_completed_successfully
      server:
        condition: service_started
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - client_dist:/usr/share/nginx/html:ro
    profiles:
      - production

volumes:
  postgres_data:
  uploads_data:
  client_dist:
