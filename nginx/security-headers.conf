# Shared response headers for the PLACA public site and staff app.
#
# Included once inside the server block. Nested locations use `expires` rather
# than `add_header`, so these headers are inherited everywhere.
#
# There is no HSTS header yet: the site runs on plain HTTP until a domain and
# certificate are assigned. Add Strict-Transport-Security when TLS is enabled.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The assistant reads questions from the microphone, so allow it for this
# origin only. Geolocation and camera stay disabled.
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

# 'unsafe-inline' is required for the JSON-LD block in index.html and for
# inline style attributes used by React. No third-party scripts are allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
