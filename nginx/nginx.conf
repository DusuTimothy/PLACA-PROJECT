# PLACA production server: static public site, staff app, and API proxy.
#
# Topology (docker compose --profile production):
#
#   browser -> nginx :80
#                 |-- /            -> /usr/share/nginx/html/index.html
#                 |-- /app/...      -> /usr/share/nginx/html/app.html
#                 |-- /assets/*     -> hashed Vite bundles
#                 '-- /api/...      -> server:5000
#
# The html files come from the `client-build` service, which runs `vite build`
# into the shared `client_dist` volume. There is no public domain yet, so this
# config listens on plain HTTP with `server_name _`. When a domain and
# certificate exist, add a TLS server block and enable HSTS.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    upstream placa_api {
        server server:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # ---------- API ----------
        # Express sets its own Cache-Control for public summaries, so nginx
        # only forwards headers here.
        location /api/ {
            proxy_pass http://placa_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---------- Staff app ----------
        # React Router owns everything below /app, so unknown paths return the
        # app shell. The shell is noindex and must not be cached.
        location = /app {
            expires -1;
            try_files /app.html =404;
        }

        location /app/ {
            expires -1;
            try_files $uri /app.html;
        }

        # ---------- Static assets ----------
        location /assets/ {
            # Vite bundle names contain a content hash.
            expires 1y;
            try_files $uri =404;
        }

        location /site/ {
            # Public site CSS, JS and logo keep stable names, so revalidate
            # hourly instead of pinning them for a year.
            expires 1h;
            try_files $uri =404;
        }

        location = /sw.js {
            expires -1;
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location = /app.html {
            expires -1;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            expires -1;
            try_files $uri =404;
        }

        # ---------- Public landing page ----------
        # Static site: unknown paths are a real 404, not an app fallback.
        location / {
            try_files $uri $uri/ =404;
        }

        # Never serve dotfiles such as .env or .git.
        location ~ /\. {
            deny all;
        }
    }
}
